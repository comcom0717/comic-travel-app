    const formatTime = (t) => {
      if (!t || typeof t !== 'string') return '';
      const parts = t.split(':');
      if (parts.length < 2) return t;
      const hour = parseInt(parts[0], 10);
      if (isNaN(hour)) return t;
      return `${hour >= 12 ? 'PM' : 'AM'} ${hour % 12 || 12}:${parts[1] || '00'}`;
    };

    const createSafeBlobUrl = (dataUrl, fallbackType = 'application/octet-stream') => {
      if (!dataUrl) return null;
      if (dataUrl.startsWith('blob:')) return dataUrl;
      try {
        const arr = dataUrl.split(',');
        if (arr.length < 2) return dataUrl;
        const mimeMatch = arr[0].match(/:(.*?);/);
        const mime = mimeMatch ? mimeMatch[1] : fallbackType;
        const bstr = atob(arr[1]);
        let n = bstr.length;
        const u8arr = new Uint8Array(n);
        while (n--) {
          u8arr[n] = bstr.charCodeAt(n);
        }
        const blob = new Blob([u8arr], { type: mime });
        return URL.createObjectURL(blob);
      } catch (e) {
        return dataUrl;
      }
    };

    function PdfViewer({ url, name }) {
      const [pages, setPages] = useState([]);
      const [numPages, setNumPages] = useState(0);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        let isMounted = true;
        const loadAndRenderPdf = async () => {
          setLoading(true);
          setError(null);
          try {
            let loadingTask;
            if (typeof url === 'string' && url.startsWith('data:application/pdf;base64,')) {
              const base64 = url.split(',')[1];
              const binaryStr = atob(base64);
              const bytes = new Uint8Array(binaryStr.length);
              for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
              }
              loadingTask = window.pdfjsLib.getDocument({ data: bytes });
            } else {
              loadingTask = window.pdfjsLib.getDocument(url);
            }

            const pdfDoc = await loadingTask.promise;
            if (!isMounted) return;
            setNumPages(pdfDoc.numPages);

            const renderedList = [];
            for (let i = 1; i <= pdfDoc.numPages; i++) {
              const page = await pdfDoc.getPage(i);
              const viewport = page.getViewport({ scale: 1.5 });
              const canvas = document.createElement('canvas');
              const ctx = canvas.getContext('2d');
              canvas.width = viewport.width;
              canvas.height = viewport.height;
              await page.render({ canvasContext: ctx, viewport }).promise;
              renderedList.push({ pageNum: i, dataUrl: canvas.toDataURL('image/jpeg', 0.85) });
            }

            if (isMounted) {
              setPages(renderedList);
              setLoading(false);
            }
          } catch (err) {
            if (isMounted) {
              setError(err.message || "PDF 載入失敗");
              setLoading(false);
            }
          }
        };

        loadAndRenderPdf();
        return () => { isMounted = false; };
      }, [url]);

      if (loading) {
        return (

        );

                <span>第 {p.pageNum} 頁</span>

    const compressImageFile = (file) => {
      return new Promise((resolve) => {
        if (!file.type || !file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => resolve(null);
          reader.readAsDataURL(file);
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 900;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.75));
          };
          img.onerror = () => resolve(e.target.result);
          img.src = e.target.result;
        };
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
      });
    };

    const safeParse = (key, fallback) => { 
      try { 
        if (typeof window === 'undefined' || !window.localStorage) return fallback;
        const s = localStorage.getItem(key); 
        if (!s) return fallback;
        const parsed = JSON.parse(s);
        return parsed !== null && parsed !== undefined ? parsed : fallback; 
      } catch { 
        return fallback; 
      } 
    };

    };

      const handleCardTouchStart = (e, idx) => {
        const touch = e.touches[0];
        touchStartPos.current = { x: touch.clientX, y: touch.clientY };
        clearTimeout(touchTimerRef.current);
        touchTimerRef.current = setTimeout(() => {
          setTouchDraggingIdx(idx);
          setTouchOverIdx(idx);
          if (typeof navigator !== 'undefined' && navigator.vibrate) {
            navigator.vibrate(40);
          }
        }, 320);
      };

      const handleCardTouchMove = (e) => {
        const touch = e.touches[0];
        if (touchDraggingIdx === null) {
          const dx = Math.abs(touch.clientX - touchStartPos.current.x);
          const dy = Math.abs(touch.clientY - touchStartPos.current.y);
          if (dx > 8 || dy > 8) {
            clearTimeout(touchTimerRef.current);
          }
          return;
        }

        if (e.cancelable) e.preventDefault();
        const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
        const cardEl = targetElement?.closest('[data-location-idx]');
        if (cardEl) {
          const targetIdx = parseInt(cardEl.getAttribute('data-location-idx'), 10);
          if (!isNaN(targetIdx) && targetIdx !== touchOverIdx) {
            setTouchOverIdx(targetIdx);
          }
        }
      };

      const handleCardTouchEnd = () => {
        clearTimeout(touchTimerRef.current);
        if (touchDraggingIdx !== null && touchOverIdx !== null && touchDraggingIdx !== touchOverIdx) {

          }));
        });
      };

      const handleOpenAttachment = (f) => {
        if (!f || !f.url) return showAlert("找不到該附件內容！");
        const isPdf = f.type === 'pdf' || (f.name && f.name.toLowerCase().endsWith('.pdf'));
        const mimeType = isPdf ? 'application/pdf' : 'image/jpeg';
        const safeUrl = createSafeBlobUrl(f.url, mimeType);
        setPreviewAttachment({
          ...f,
          isPdf,
          safeUrl: safeUrl || f.url
        });
      };

      const moveLocation = (dayNum, fromIdx, toIdx) => {
        setItinerary(prev => prev.map(d => {
          if (d.day !== dayNum) return d;
          const list = [...(d.locations || [])];
          if (toIdx < 0 || toIdx >= list.length) return d;
          const [moved] = list.splice(fromIdx, 1);
          list.splice(toIdx, 0, moved);
          return { ...d, locations: list };
        }));
      };

      const handleDragStart = (e, idx) => {
        dragItem.current = idx;
        if (e.dataTransfer) {
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', String(idx));
        }
        setTimeout(() => {
          if (e.target) e.target.style.opacity = '0.4';
        }, 0);
      };

      const onDragEnd = (e) => {
        if (e.target) e.target.style.opacity = '1';
        if (dragItem.current !== null && dragOverItem.current !== null && dragItem.current !== dragOverItem.current) {
          moveLocation(selectedDay, dragItem.current, dragOverItem.current);
        }
        dragItem.current = null;
        dragOverItem.current = null;
      };

      const handleSaveItineraryItem = (data) => {
        setItinerary(prev => prev.map(d => {
          if (d.day !== selectedDay) return d;
          const attachments = data.newAttachments || [];
          const newItem = { 
            ...data, 
            attachments, 
            id: editingItem ? editingItem.id : Date.now() + Math.random()
          };
          delete newItem.newAttachments;
          const list = d.locations || [];
          const locations = editingItem 
            ? list.map(l => l.id === editingItem.id ? newItem : l) 
            : [...list, newItem];
          return { ...d, locations: locations.sort((a, b) => (a.time || '').localeCompare(b.time || '')) };
        }));
        setShowItineraryModal(false);
      };

      const promptDeleteItinerary = (e, id) => {
        e.stopPropagation();
        showConfirm("確定要刪除這個行程景點嗎？", () => {
          setItinerary(prev => prev.map(day => 
            day.day === selectedDay 
              ? { ...day, locations: (day.locations || []).filter(l => l.id !== id) } 
              : day
          ));
        });
      };

      const handleAddDay = () => {
        const nextDayNum = itinerary.length + 1;
        const start = new Date(tripInfo.startDate);
        if (!isNaN(start.getTime())) {
          start.setDate(start.getDate() + nextDayNum - 1);
        }
        const dateStr = !isNaN(start.getTime()) ? start.toISOString().split('T')[0] : '';
        setItinerary([...itinerary, { day: nextDayNum, date: dateStr, locations: [] }]);
        setSelectedDay(nextDayNum);
      };

      const calculateExpense = (e) => {
        if (!e) return { baseAmount: 0 };
        const curr = e.currency || 'TWD';
        const rate = rates[curr] || MOCK_RATES[curr] || 1;
        const amount = Number(e.amount) || 0;
        const baseAmount = curr === 'TWD' ? amount : Math.round(amount * rate);
        return { baseAmount };
      };

      const filteredExpenses = (Array.isArray(expenses) ? expenses : []).filter(e => filterCategory === 'all' || e.category === filterCategory);
      const totalSpent = filteredExpenses.reduce((acc, cur) => acc + calculateExpense(cur).baseAmount, 0);

      const handleSaveExpense = (data) => {
        if (editingExpense) {
          setExpenses(prev => prev.map(e => e.id === editingExpense.id ? { ...data, id: e.id } : e));
        } else {
          setExpenses(prev => [...prev, { ...data, id: Date.now() + Math.random() }]);
        }
        setShowExpenseModal(false);
      };

      const handleSaveNotice = (data) => {
        if (editingNotice) {
          setNotices(prev => prev.map(n => n.id === editingNotice.id ? { ...data, id: n.id } : n));
        } else {
          setNotices(prev => [{ ...data, id: Date.now() }, ...prev]);
        }
        setShowNoticeModal(false);
      };

      const handleDeleteNotice = (id) => {
        showConfirm("確定要刪除這筆旅遊備忘嗎？", () => {
          setNotices(prev => prev.filter(n => n.id !== id));
        });
      };

      const handleCopyNotice = (text, id) => {
        try {
          const el = document.createElement('textarea');
          el.value = text;
          document.body.appendChild(el);
          el.select();
          document.execCommand('copy');
          document.body.removeChild(el);
          setCopySuccessId(id);
          setTimeout(() => setCopySuccessId(null), 1800);
        } catch {
          showAlert("複製失敗，請手動複製");
        }
      };

      const uniqueNoticeCategories = Array.from(new Set(notices.map(n => n.category).filter(Boolean)));

      const handleSaveShoppingItem = async (data) => {
        let finalImg = data.image;
        if (data.imageFile) {
          finalImg = await compressImageFile(data.imageFile);
        }
        if (editingShopItem) {
          setShoppingList(prev => prev.map(i => i.id === editingShopItem.id ? { ...i, ...data, image: finalImg !== undefined ? finalImg : i.image } : i));
        } else {
          setShoppingList(prev => [...prev, { ...data, id: Date.now(), image: finalImg, done: false }]);
        }
        setShowShoppingModal(false);
      };

      const TabButton = ({ id, icon: Icon, label }) => {
        const isActive = activeTab === id;
        return (
          <button 
            onClick={() => setActiveTab(id)} 
            className={`flex flex-col items-center justify-center flex-1 py-2 sm:py-2.5 transition-all select-none cursor-pointer ${
              isActive 
                ? 'bg-yellow-300 text-black font-black -translate-y-1' 
                : 'bg-white text-gray-700 hover:bg-yellow-50 font-bold'
            } ${comicStyles.borders}`}
          >
            <Icon size={20} strokeWidth={isActive ? 3 : 2.2} />
            <span className="text-[11px] sm:text-xs mt-0.5 leading-none">{label}</span>
          </button>
        );
      };

      const flights = Array.isArray(tripInfo?.flights) ? tripInfo.flights : [];
      const hotels = Array.isArray(tripInfo?.hotels) ? tripInfo.hotels : INITIAL_TRIP_INFO.hotels;

      const currentDay = itinerary.find(d => d.day === selectedDay) || itinerary[0] || { day: 1, date: '', locations: [] };
      const currentLocations = Array.isArray(currentDay.locations) ? currentDay.locations : [];

      const shoppingByStore = (Array.isArray(shoppingList) ? shoppingList : []).reduce((acc, item) => {
        const storeName = (item.store || '').trim() || '未指定地點';
        if (!acc[storeName]) acc[storeName] = [];
        acc[storeName].push(item);
        return acc;
      }, {});

      const formatDateDisplay = (dateStr) => {
        if (!dateStr) return '';
        const parts = dateStr.split('-');
        if (parts.length === 3) {
          return `${parts[0]}/${parts[1]}/${parts[2]}`;

        return dateStr;

      return (
        <div className={`flex flex-col h-screen max-w-md mx-auto overflow-hidden bg-white font-sans ${comicStyles.borders} ${comicStyles.bgPattern}`}>

              <div className="flex items-center gap-2 text-[11px] sm:text-xs font-bold text-blue-100 mt-0.5 truncate">

                            <div className="flex flex-col space-y-3">

                              <div className="flex justify-around items-center text-center">
                                <div>
                                  <div className="text-xl font-black text-gray-900">{f.from}</div>
                                  {f.fromTerminal && <div className="text-[10px] font-bold text-blue-600">航廈: {f.fromTerminal}</div>}
                                  <div className="text-[10px] font-bold text-gray-400 font-mono">{formatDateDisplay(f.depDate)}</div>
                                  <div className="text-blue-600 font-black text-xs">{formatTime(f.depTime)}</div>
                                </div>
                                <div className="flex flex-col items-center">
                                  <span className="text-[10px] font-black text-gray-700 bg-blue-100 px-1.5 py-0.5 rounded border border-black mb-1">{f.code}</span>
                                  <ArrowRight size={18} className="text-gray-400"/>
                                </div>
                                <div>
                                  <div className="text-xl font-black text-gray-900">{f.transitAirport || '轉機地'}</div>
                                  {f.transitTerminal && <div className="text-[10px] font-bold text-blue-600">航廈: {f.transitTerminal}</div>}
                                  <div className="text-[10px] font-bold text-gray-400 font-mono">{formatDateDisplay(f.transitArrDate || f.depDate)}</div>
                                  <div className="text-blue-600 font-black text-xs">{formatTime(f.transitArrTime)}</div>
                                </div>
                              </div>

                              {/* 第二段：轉機點 -> 目的地 */}
                              <div className="flex justify-around items-center text-center pt-3 border-t border-dashed border-gray-200">
                                <div>
                                  <div className="text-xl font-black text-gray-900">{f.transitAirport || '轉機地'}</div>
                                  {f.transitTerminal && <div className="text-[10px] font-bold text-blue-600">航廈: {f.transitTerminal}</div>}
                                  <div className="text-[10px] font-bold text-gray-400 font-mono">{formatDateDisplay(f.transitDepDate || f.transitArrDate || f.depDate)}</div>
                                  <div className="text-blue-600 font-black text-xs">{formatTime(f.transitDepTime)}</div>
                                </div>
                                <div className="flex flex-col items-center">
                                  <span className="text-[10px] font-black text-gray-700 bg-blue-100 px-1.5 py-0.5 rounded border border-black mb-1">{f.transitFlightCode || f.code}</span>
                                  <ArrowRight size={18} className="text-gray-400"/>
                                </div>
                                <div>
                                  <div className="text-xl font-black text-gray-900">{f.to}</div>
                                  {f.toTerminal && <div className="text-[10px] font-bold text-blue-600">航廈: {f.toTerminal}</div>}
                                  <div className="text-[10px] font-bold text-gray-400 font-mono">{formatDateDisplay(f.arrDate || f.transitDepDate || f.depDate)}</div>
                                  <div className="text-blue-600 font-black text-xs">{formatTime(f.arrTime)}</div>
                                </div>
                              </div>
                            </div>
                          ) : (
                            <div className="flex justify-around items-center text-center">
                              <div>
                                <div className="text-xl font-black text-gray-900">{f.from}</div>
                                {f.fromTerminal && <div className="text-[10px] font-bold text-blue-600">航廈: {f.fromTerminal}</div>}
                                <div className="text-[10px] font-bold text-gray-400 font-mono">{formatDateDisplay(f.depDate)}</div>
                                <div className="text-blue-600 font-black text-xs">{formatTime(f.depTime)}</div>
                              </div>
                              <div className="flex flex-col items-center">
                                <span className="text-xs font-black text-gray-700 bg-blue-100 px-2 py-0.5 rounded border border-black mb-1">{f.code}</span>
                                <ArrowRight size={20} className="text-gray-400"/>
                              </div>
                              <div>
                                <div className="text-xl font-black text-gray-900">{f.to}</div>
                                {f.toTerminal && <div className="text-[10px] font-bold text-blue-600">航廈: {f.toTerminal}</div>}
                                <div className="text-[10px] font-bold text-gray-400 font-mono">{formatDateDisplay(f.arrDate || f.depDate)}</div>
                                <div className="text-blue-600 font-black text-xs">{formatTime(f.arrTime)}</div>
                              </div>
                            </div>
                          )}

                          {f.hasTransit && f.transitNote && (
                            <div className="bg-orange-50 border border-orange-300 p-2.5 rounded-xl text-xs space-y-1 font-bold text-orange-900">
                              <div className="flex items-center gap-1 text-orange-800 font-black">
                                <Plane size={13}/> 轉機注意事項：{f.transitNote}
                              </div>
                            </div>
                          )}
                        </div>
                      </div>
                    ))
                  )}
                </div>

                {/* 住宿基地卡片 */}
                <div className="space-y-3">
                  <div className="flex justify-between items-center">
                    <span className={`text-base font-black bg-purple-200 text-purple-950 ${comicStyles.sticker}`}>
                      <Building className="inline mr-1" size={16}/> 住宿基地
                    </span>
                    <button onClick={() => { setEditingHotel(null); setShowHotelModal(true); }} className={comicStyles.buttonSecondary}>
                      <Plus size={14} /> 新增住宿
                    </button>
                  </div>

                  {hotels.map((hotel, idx) => (
                    <div key={hotel.id || idx} className={`bg-white rounded-2xl p-3.5 ${comicStyles.borders} ${comicStyles.shadowsSmall} space-y-3`}>
                      <div className="flex justify-between items-start gap-2">
                        <h4 className="font-black text-base text-gray-900 leading-snug">
                          <span className="bg-yellow-300 border border-black rounded-full px-1.5 py-0.5 text-xs mr-1.5">{idx + 1}</span>
                          {hotel.name}
                        </h4>
                        <div className="flex items-center gap-1 flex-shrink-0">
                          <button onClick={() => { setEditingHotel(hotel); setShowHotelModal(true); }} className="p-1 text-blue-600 hover:bg-blue-50 rounded border border-gray-300 cursor-pointer">
                            <Pencil size={13} strokeWidth={2.5}/>
                          </button>
                          <button onClick={() => showConfirm("確定要刪除這筆住宿基地嗎？", () => setTripInfo(prev => ({ ...prev, hotels: prev.hotels.filter(h => h.id !== hotel.id) })))} className="p-1 text-red-600 hover:bg-red-50 rounded border border-gray-300 cursor-pointer">
                            <Trash2 size={13} strokeWidth={2.5}/>
                          </button>

                      </div>

                      <div className="text-xs text-purple-800 font-bold bg-purple-50 p-2 rounded-lg border border-purple-200 flex items-center gap-1">
                        <CalendarRange size={13} /> {hotel.checkIn} ~ {hotel.checkOut}
                      </div>

                      <div className="flex items-center justify-between gap-2 pt-0.5">
                        <p className="text-xs font-bold text-gray-600 break-words flex-1">
                          <MapPin size={13} className="inline mr-1 text-purple-700"/>{hotel.address}
                        </p>
                        <button onClick={() => openMap(hotel.address || hotel.name)} className="bg-purple-100 text-purple-950 border-2 border-black hover:bg-purple-200 px-3 py-1.5 rounded-lg text-xs font-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:translate-y-0.5 active:shadow-none flex items-center gap-1 flex-shrink-0 cursor-pointer">
                          <Navigation size={13}/> 地圖導航
                        </button>

                      {/* 附件清單 */}
                      <div className="pt-2 border-t border-dashed border-gray-200">

                                <span className="truncate max-w-[120px]">{f.name}</span>

                                  <X size={12}/>

                    const isSelected = selectedDay === d.day;

                    return (
                      <button

                        type="button"
                        onClick={() => setSelectedDay(d.day)}
                        className={`flex-shrink-0 min-w-[72px] px-3 py-2 rounded-2xl flex flex-col items-center justify-center transition-all cursor-pointer select-none border-2 sm:border-3 border-black ${

    /* 附屬 Modals 函數 */
    function ExpenseModal({ members, onClose, onSave, initialData, rates }) {
      const [cat, setCat] = useState(initialData?.category || 'food'); 
      const [pay, setPay] = useState(initialData?.payer || (members[0] || ''));
      const [currency, setCurrency] = useState(initialData?.currency || 'JPY'); 
      const [amount, setAmount] = useState(initialData?.amount || '');
      const [splitMembers, setSplitMembers] = useState(() => {
        if (initialData && Array.isArray(initialData.splitMembers)) return initialData.splitMembers;
        return members;
      });

      const toggleSplitMember = (m) => {
        if (splitMembers.includes(m)) {
          if (splitMembers.length === 1) return;
          setSplitMembers(splitMembers.filter(x => x !== m));
        } else {
          setSplitMembers([...splitMembers, m]);
        }
      };

      const currentRate = (rates && rates[currency]) || MOCK_RATES[currency] || 1;
      const convertedAmount = currency === 'TWD' ? (Number(amount) || 0) : Math.round((Number(amount) || 0) * currentRate);
      const perPerson = splitMembers.length > 0 ? Math.round(convertedAmount / splitMembers.length) : convertedAmount;

      const handleSubmit = (e) => { 
        e.preventDefault(); 
        if (!pay) return alert("請先設定或選擇付款人！");
        const d = new FormData(e.target); 
        onSave({ 
          title: d.get('title') || '未命名項目', 
          amount: Number(amount) || 0, 
          currency, 
          payer: pay, 
          category: cat, 
          splitMembers,
          date: initialData?.date || new Date().toISOString().split('T')[0] 
        }); 
      };
      
      return (
        <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-3.5">
          <div className={comicStyles.modal}>
            <div className="flex justify-between items-center mb-3">
              <h3 className={`text-base font-black ${comicStyles.sticker} bg-green-300 text-black`}>{initialData ? '編輯帳目' : '記一筆'}</h3>
              <button onClick={onClose} className="border-2 border-black rounded-full p-1 hover:bg-red-100 cursor-pointer"><X size={16}/></button>
            </div>
            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="block text-xs font-black mb-1">消費項目</label>
                <input name="title" defaultValue={initialData?.title} className={comicStyles.input} placeholder="例如：餐費、門票" required />
              </div>
              <div>
                <label className="block text-xs font-black mb-1">類別</label>
                <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-hide">
                  {Object.entries(CATEGORIES).map(([k, v]) => (
                    <button key={k} type="button" onClick={() => setCat(k)} className={`px-2 py-1 border-2 rounded-lg text-xs font-bold flex items-center gap-1 flex-shrink-0 cursor-pointer ${cat === k ? 'bg-black text-white border-black' : 'bg-white text-gray-600 border-black'}`}>
                      <v.icon size={11}/>{v.label}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <label className="block text-xs font-black mb-1">金額與幣別</label>
                <div className="flex gap-2">
                  <input name="amount" type="number" value={amount} onChange={e => setAmount(e.target.value)} className="flex-1 min-w-0 border-2 border-black rounded-xl p-2.5 font-black text-base focus:bg-yellow-50 outline-none" required placeholder="0" min="0"/>
                  <select value={currency} onChange={(e) => setCurrency(e.target.value)} className="w-24 border-2 border-black rounded-xl p-2 font-black text-sm bg-white">
                    {Object.keys(MOCK_RATES).map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
              </div>
              <div>
                <label className="block text-xs font-black mb-1">付款勇者</label>
                {members.length === 0 ? (
                  <div className="text-xs text-red-500 font-bold bg-red-50 p-2 rounded-lg border border-red-200">尚未設定成員，請至上方「成員設定」新增！</div>
                ) : (
                  <div className="flex gap-1.5 overflow-x-auto pb-1">
                    {members.map(m => (
                      <button key={m} type="button" onClick={() => setPay(m)} className={`px-3 py-1 rounded-lg border-2 text-xs font-bold cursor-pointer ${pay === m ? 'bg-orange-300 border-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]' : 'bg-gray-100 border-gray-400'}`}>{m}</button>
                    ))}
                  </div>
                )}
              </div>
              <div>
                <label className="block text-xs font-black mb-1 flex items-center justify-between">
                  <span>參與平分對象 ({splitMembers.length}人)</span>
                  <span className="text-green-700 font-bold">每人約 NT$ {perPerson.toLocaleString()}</span>
                </label>
                <div className="flex flex-wrap gap-1.5 pt-1">
                  {members.map(m => {
                    const isSelected = splitMembers.includes(m);
                    return (
                      <button key={m} type="button" onClick={() => toggleSplitMember(m)} className={`px-3 py-1 rounded-lg border-2 text-xs font-bold cursor-pointer ${isSelected ? 'bg-green-300 text-green-950 border-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]' : 'bg-white text-gray-400 border-gray-300'}`}>
                        {isSelected ? '✓ ' : '+ '}{m}
                      </button>
                    );
                  })}
                </div>
              </div>
              <button type="submit" className={comicStyles.buttonPrimary}>確認儲存</button>
            </form>
          </div>
        </div>
      );
    }

    function ItineraryModal({ item, onClose, onSave }) {
      const [attachments, setAttachments] = useState(Array.isArray(item?.attachments) ? item.attachments : []);
      const [time, setTime] = useState(item?.time || '09:00');
      const [category, setCategory] = useState(item?.category || 'sightseeing');

      const handleFileUpload = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const dataUrl = await compressImageFile(file);
        if (!dataUrl) return;
        const isPdf = file.type === 'application/pdf' || (file.name && file.name.toLowerCase().endsWith('.pdf'));
        setAttachments(prev => [...prev, { name: file.name, url: dataUrl, type: isPdf ? 'pdf' : 'image' }]);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const d = new FormData(e.target);
        onSave({
          time,
          name: d.get('name') || '新景點',
          note: d.get('note') || '',
          category,
          newAttachments: attachments
        });
      };

      return (
        <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-3.5">
          <div className={comicStyles.modal}>
            <div className="flex justify-between items-center mb-4">
              <h3 className={`text-base font-black ${comicStyles.sticker} bg-blue-300 text-black`}>{item ? '編輯行程' : '新增景點'}</h3>
              <button onClick={onClose} className="border-2 border-black rounded-full p-1 hover:bg-red-100 cursor-pointer"><X size={16}/></button>
            </div>
            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="bg-blue-50/70 border-2 border-black rounded-2xl p-3.5 space-y-3">

                  <label className="block text-xs font-black text-blue-950 mb-1.5 flex items-center gap-1"><Clock size={13}/> 時間</label>
                  <div className="w-full bg-white border-2 border-black rounded-xl p-1 overflow-hidden">
                    <input type="time" value={time} onChange={e => setTime(e.target.value)} className="w-full bg-transparent text-center text-sm font-black outline-none py-1.5 px-2 cursor-pointer" required />
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-black text-blue-950 mb-1.5 flex items-center gap-1"><Tag size={13}/> 類別</label>
                  <div className="grid grid-cols-3 gap-1.5">
                    {Object.entries(CATEGORIES).map(([k, v]) => {
                      const CatIcon = v.icon;
                      const isSelected = category === k;
                      return (
                        <button key={k} type="button" onClick={() => setCategory(k)} className={`py-1.5 px-2 rounded-xl border-2 text-xs font-black flex items-center justify-center gap-1 cursor-pointer ${isSelected ? 'bg-black text-yellow-300 border-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]' : 'bg-white text-gray-700 border-black/70'}`}>
                          <CatIcon size={12}/>{v.label}
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
              <div>
                <label className="block text-xs font-black mb-1.5 flex items-center gap-1"><MapPin size={13} className="text-red-500"/> 地點名稱</label>
                <input name="name" defaultValue={item?.name} className={comicStyles.input} placeholder="例如：雙子星塔" required />
              </div>
              <div>
                <label className="block text-xs font-black mb-1.5 flex items-center gap-1"><FileText size={13}/> 備忘</label>
                <textarea name="note" defaultValue={item?.note} rows={2} className="w-full border-2 border-black rounded-xl p-2.5 font-bold text-xs bg-white outline-none" placeholder="停留時間、預約編號..." />
              </div>
              <div className="bg-yellow-50 border-2 border-black rounded-2xl p-3 space-y-2">
                <div className="flex justify-between items-center">
                  <label className="text-xs font-black text-yellow-950 flex items-center gap-1"><Paperclip size={13}/> 憑證照片 / PDF</label>
                  <label className="cursor-pointer bg-black text-yellow-300 px-2.5 py-1 rounded-lg text-[11px] font-black border border-black">+ 上傳<input type="file" className="hidden" onChange={handleFileUpload} accept="image/*,.pdf" /></label>
                </div>
                {attachments.length > 0 && (
                  <div className="flex flex-wrap gap-1.5 pt-1">
                    {attachments.map((f, i) => (
                      <div key={i} className="inline-flex items-center gap-1 bg-white border border-black px-2 py-1 rounded-md text-[11px] font-bold">
                        <span className="truncate max-w-[130px]">{f.name}</span>
                        <button type="button" onClick={() => setAttachments(attachments.filter((_, idx) => idx !== i))} className="text-red-500"><X size={12}/></button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
              <button type="submit" className={comicStyles.buttonPrimary}>儲存行程</button>
            </form>
          </div>
        </div>
      );
    }

    function HotelModal({ hotel, onClose, onSave }) {
      return (
        <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-3.5">
          <div className={comicStyles.modal}>
            <div className="flex justify-between items-center mb-3">

                    <div className="bg-white border-2 border-black rounded-xl p-1 overflow-hidden">
                      <input name="checkOut" type="date" defaultValue={hotel?.checkOut} className="w-full bg-transparent text-center text-xs font-black outline-none py-1" required />

              </div>
              <button type="submit" className={comicStyles.buttonPrimary}>儲存住宿</button>
            </form>
          </div>
        </div>

      });

      const addFlightSegment = () => {
        setFlights([...flights, { id: Date.now(), name: `航段 ${flights.length + 1}`, code: '', from: '', fromTerminal: '', to: '', toTerminal: '', depDate: info.startDate || '', depTime: '', arrDate: info.startDate || '', arrTime: '', hasTransit: false, transitAirport: '', transitTerminal: '', transitFlightCode: '', transitArrDate: '', transitArrTime: '', transitDepDate: '', transitDepTime: '', transitNote: '' }]);

              </div>
              <div>
                <label className="block text-xs font-black mb-1">造訪國家與城市</label>
                <input name="location" defaultValue={info.location} className={comicStyles.input} required />
              </div>

              <div className="border-t-2 border-dashed border-gray-300 pt-3.5 space-y-3">
                <div className="flex justify-between items-center">
                  <span className="text-xs font-black bg-blue-100 px-2.5 py-1 rounded-lg border border-black">航班資訊 ({flights.length})</span>
                  <button type="button" onClick={addFlightSegment} className="bg-black text-yellow-300 px-2.5 py-1 rounded-lg text-xs font-black border border-black cursor-pointer">+ 新增航班資訊</button>
                </div>

                <div className="space-y-4 max-h-72 overflow-y-auto pr-1">
                  {flights.map((f, idx) => (
                    <div key={f.id || idx} className="bg-blue-50 border-2 border-black rounded-xl p-3 space-y-3">
                      <div className="flex justify-between items-center gap-2">
                        <input value={f.name || `航段 ${idx + 1}`} onChange={(e) => updateFlightSegment(f.id, 'name', e.target.value)} className="text-xs font-black bg-white border border-black rounded px-2 py-0.5 w-36" placeholder="航段名稱" />
                        {flights.length > 1 && (
                          <button type="button" onClick={() => setFlights(flights.filter(x => x.id !== f.id))} className="text-red-600"><Trash2 size={15}/></button>
                        )}
                      </div>

                      <div className="grid grid-cols-3 gap-2">
                        <div>
                          <label className="block text-[10px] font-black text-gray-500 mb-0.5">航班號</label>
                          <input value={f.code} onChange={(e) => updateFlightSegment(f.id, 'code', e.target.value)} placeholder="AK123" className="w-full border-2 border-black rounded-lg p-1.5 text-xs font-bold bg-white" required />
                        </div>
                        <div>
                          <label className="block text-[10px] font-black text-gray-500 mb-0.5">出發機場/航廈</label>
                          <div className="flex gap-1">
                            <input value={f.from} onChange={(e) => updateFlightSegment(f.id, 'from', e.target.value)} placeholder="TPE" className="w-3/5 border-2 border-black rounded-lg p-1.5 text-xs font-bold bg-white" required />
                            <input value={f.fromTerminal || ''} onChange={(e) => updateFlightSegment(f.id, 'fromTerminal', e.target.value)} placeholder="T1" className="w-2/5 border-2 border-black rounded-lg p-1.5 text-xs font-bold bg-white" />
                          </div>
                        </div>
                        <div>
                          <label className="block text-[10px] font-black text-gray-500 mb-0.5">到達機場/航廈</label>
                          <div className="flex gap-1">
                            <input value={f.to} onChange={(e) => updateFlightSegment(f.id, 'to', e.target.value)} placeholder="KUL" className="w-3/5 border-2 border-black rounded-lg p-1.5 text-xs font-bold bg-white" required />
                            <input value={f.toTerminal || ''} onChange={(e) => updateFlightSegment(f.id, 'toTerminal', e.target.value)} placeholder="T2" className="w-2/5 border-2 border-black rounded-lg p-1.5 text-xs font-bold bg-white" />
                          </div>
                        </div>
                      </div>

                      <div className="space-y-2 pt-1">
                        <div className="grid grid-cols-2 gap-2">
                          <div>
                            <label className="block text-[10px] font-black text-gray-500 mb-0.5">出發日期</label>
                            <input type="date" value={f.depDate || info.startDate} onChange={(e) => updateFlightSegment(f.id, 'depDate', e.target.value)} className="w-full border-2 border-black rounded-lg p-1 text-xs font-black bg-white" required />
                          </div>
                          <div>
                            <label className="block text-[10px] font-black text-gray-500 mb-0.5">起飛時間</label>
                            <input type="time" value={f.depTime} onChange={(e) => updateFlightSegment(f.id, 'depTime', e.target.value)} className="w-full border-2 border-black rounded-lg p-1 text-xs font-black bg-white" required />
                          </div>
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                          <div>
                            <label className="block text-[10px] font-black text-gray-500 mb-0.5">抵達日期</label>
                            <input type="date" value={f.arrDate || f.depDate} onChange={(e) => updateFlightSegment(f.id, 'arrDate', e.target.value)} className="w-full border-2 border-black rounded-lg p-1 text-xs font-black bg-white" required />
                          </div>
                          <div>
                            <label className="block text-[10px] font-black text-gray-500 mb-0.5">抵達時間</label>
                            <input type="time" value={f.arrTime} onChange={(e) => updateFlightSegment(f.id, 'arrTime', e.target.value)} className="w-full border-2 border-black rounded-lg p-1 text-xs font-black bg-white" required />
                          </div>
                        </div>
                      </div>

                      <div className="pt-2 border-t border-dashed border-blue-200 space-y-2">
                        <label className="flex items-center gap-2 cursor-pointer text-xs font-black text-blue-950">
                          <input type="checkbox" checked={f.hasTransit || false} onChange={(e) => updateFlightSegment(f.id, 'hasTransit', e.target.checked)} className="w-4 h-4 border-2 border-black rounded accent-black" />
                          轉機
                        </label>

                        {f.hasTransit && (
                          <div className="bg-white border-2 border-black rounded-xl p-3 space-y-2.5 text-xs">
                            <div className="grid grid-cols-3 gap-2">
                              <div>
                                <label className="block text-[10px] font-black text-gray-500 mb-0.5">轉機機場</label>
                                <input value={f.transitAirport || ''} onChange={(e) => updateFlightSegment(f.id, 'transitAirport', e.target.value)} placeholder="BKK" className="w-full border-2 border-black rounded-lg p-1 font-bold bg-white" />
                              </div>
                              <div>
                                <label className="block text-[10px] font-black text-gray-500 mb-0.5">轉機航廈</label>
                                <input value={f.transitTerminal || ''} onChange={(e) => updateFlightSegment(f.id, 'transitTerminal', e.target.value)} placeholder="T1" className="w-full border-2 border-black rounded-lg p-1 font-bold bg-white" />
                              </div>
                              <div>
                                <label className="block text-[10px] font-black text-gray-500 mb-0.5">轉機航班號</label>
                                <input value={f.transitFlightCode || ''} onChange={(e) => updateFlightSegment(f.id, 'transitFlightCode', e.target.value)} placeholder="AK789" className="w-full border-2 border-black rounded-lg p-1 font-bold bg-white" />
                              </div>
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                              <div>
                                <label className="block text-[10px] font-black text-gray-500 mb-0.5">抵達轉機地日期/時間</label>
                                <div className="flex gap-1">
                                  <input type="date" value={f.transitArrDate || f.depDate} onChange={(e) => updateFlightSegment(f.id, 'transitArrDate', e.target.value)} className="w-1/2 border border-black rounded p-1 text-[10px]" />
                                  <input type="time" value={f.transitArrTime || ''} onChange={(e) => updateFlightSegment(f.id, 'transitArrTime', e.target.value)} className="w-1/2 border border-black rounded p-1 text-[10px]" />
                                </div>
                              </div>
                              <div>
                                <label className="block text-[10px] font-black text-gray-500 mb-0.5">轉機起飛日期/時間</label>
                                <div className="flex gap-1">
                                  <input type="date" value={f.transitDepDate || f.transitArrDate || f.depDate} onChange={(e) => updateFlightSegment(f.id, 'transitDepDate', e.target.value)} className="w-1/2 border border-black rounded p-1 text-[10px]" />
                                  <input type="time" value={f.transitDepTime || ''} onChange={(e) => updateFlightSegment(f.id, 'transitDepTime', e.target.value)} className="w-1/2 border border-black rounded p-1 text-[10px]" />
                                </div>
                              </div>
                            </div>
                            <div>
                              <label className="block text-[10px] font-black text-gray-500 mb-0.5">轉機注意事項</label>
                              <input value={f.transitNote || ''} onChange={(e) => updateFlightSegment(f.id, 'transitNote', e.target.value)} placeholder="例如：行李直掛" className="w-full border-2 border-black rounded-lg p-1 font-bold bg-white" />
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <button type="submit" className={comicStyles.buttonPrimary}>儲存所有設定</button>
            </form>
          </div>
        </div>
      );
    }

    function NoticeModal({ notice, onClose, onSave }) {
      const [category, setCategory] = useState(notice?.category || '');
      const [attachments, setAttachments] = useState(Array.isArray(notice?.attachments) ? notice.attachments : []);

      const handleFileUpload = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const dataUrl = await compressImageFile(file);
        if (!dataUrl) return;
        const isPdf = file.type === 'application/pdf' || (file.name && file.name.toLowerCase().endsWith('.pdf'));
        setAttachments(prev => [...prev, { name: file.name, url: dataUrl, type: isPdf ? 'pdf' : 'image' }]);
      };

      return (
        <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-3.5">
          <div className={comicStyles.modal}>
            <div className="flex justify-between items-center mb-3">
              <h3 className={`text-base font-black ${comicStyles.sticker} bg-yellow-300 text-black`}>{notice ? '編輯注意事項' : '新增注意事項'}</h3>
              <button onClick={onClose} className="border-2 border-black rounded-full p-1 hover:bg-red-100 cursor-pointer"><X size={16}/></button>
            </div>
            <form onSubmit={(e) => {
              e.preventDefault();
              const d = new FormData(e.target);
              onSave({ title: d.get('title'), category: category.trim(), content: d.get('content'), attachments });
            }} className="space-y-3.5">
              <div>
                <label className="block text-xs font-black mb-1">分類標籤</label>
                <input value={category} onChange={e => setCategory(e.target.value)} className={comicStyles.input} placeholder="例如：海關規定、緊急聯絡..." />
              </div>
              <div>
                <label className="block text-xs font-black mb-1">標題</label>
                <input name="title" defaultValue={notice?.title} className={comicStyles.input} placeholder="例如：緊急救助電話" required />
              </div>
              <div>
                <label className="block text-xs font-black mb-1">內容詳細說明</label>
                <textarea name="content" defaultValue={notice?.content} rows={4} className="w-full border-2 border-black rounded-xl p-3 font-bold text-xs bg-white outline-none" placeholder="填入詳細說明..." required />
              </div>
              <div className="bg-yellow-50 border-2 border-black rounded-2xl p-3 space-y-2">
                <div className="flex justify-between items-center">
                  <label className="text-xs font-black text-yellow-950 flex items-center gap-1"><Paperclip size={13}/> 補充附件 (圖片 / PDF)</label>
                  <label className="cursor-pointer bg-black text-yellow-300 px-2.5 py-1 rounded-lg text-[11px] font-black border border-black">+ 上傳檔案<input type="file" className="hidden" onChange={handleFileUpload} accept="image/*,.pdf" /></label>
                </div>
                {attachments.length > 0 && (
                  <div className="flex flex-wrap gap-1.5 pt-1">
                    {attachments.map((f, i) => (
                      <div key={i} className="inline-flex items-center gap-1 bg-white border border-black px-2 py-1 rounded-md text-[11px] font-bold">
                        <span className="truncate max-w-[130px]">{f.name}</span>
                        <button type="button" onClick={() => setAttachments(attachments.filter((_, idx) => idx !== i))} className="text-red-500"><X size={12}/></button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
              <button type="submit" className={comicStyles.buttonPrimary}>儲存資訊項目</button>
            </form>
          </div>
        </div>
      );
    }

    function ShoppingModal({ item, onClose, onSave }) {
      const [image, setImage] = useState(item?.image || null);

      const handleImageUpload = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const dataUrl = await compressImageFile(file);
        if (dataUrl) setImage(dataUrl);
      };

      return (
        <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-3.5">
          <div className={comicStyles.modal}>
            <div className="flex justify-between items-center mb-3">
              <h3 className={`text-base font-black ${comicStyles.sticker} bg-pink-300 text-black`}>{item ? '編輯商品' : '新增商品'}</h3>
              <button onClick={onClose} className="border-2 border-black rounded-full p-1 hover:bg-red-100 cursor-pointer"><X size={16}/></button>
            </div>
            <form onSubmit={(e) => {
              e.preventDefault();
              const d = new FormData(e.target);
              onSave({ name: d.get('name'), store: d.get('store'), image });
            }} className="space-y-3.5">
              <div>
                <label className="block text-xs font-black mb-1">商品名稱</label>
                <input name="name" defaultValue={item?.name} className={comicStyles.input} placeholder="例如：白咖啡" required />
              </div>
              <div>
                <label className="block text-xs font-black mb-1">購買地點 / 店鋪備忘</label>
                <input name="store" defaultValue={item?.store} className={comicStyles.input} placeholder="例如：超級市場" />
              </div>
              <div className="bg-pink-50 border-2 border-black rounded-2xl p-3 space-y-2">
                <div className="flex justify-between items-center">
                  <label className="text-xs font-black text-pink-950 flex items-center gap-1"><ImageIcon size={13}/> 商品照片</label>
                  <label className="cursor-pointer bg-black text-yellow-300 px-2.5 py-1 rounded-lg text-[11px] font-black border border-black">+ 上傳照片<input type="file" className="hidden" accept="image/*" onChange={handleImageUpload} /></label>
                </div>
                {image && (
                  <div className="flex items-center gap-3 pt-1">
                    <img src={image} alt="preview" className="w-16 h-16 object-cover rounded-lg border-2 border-black" />
                    <button type="button" onClick={() => setImage(null)} className="bg-red-100 text-red-600 border border-red-400 px-2 py-1 rounded text-xs font-bold">移除</button>
                  </div>
                )}
              </div>
              <button type="submit" className={comicStyles.buttonPrimary}>儲存商品</button>
            </form>
          </div>
        </div>
      );
    }

    function MemberModal({ members, onClose, onAdd, onRemove }) {
      const [name, setName] = useState('');
      return (
        <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-3.5">
          <div className={comicStyles.modal}>
            <div className="flex justify-between items-center mb-3">
              <h3 className={`text-base font-black ${comicStyles.sticker} bg-orange-300 text-black`}>隊伍成員設定</h3>
              <button onClick={onClose} className="border-2 border-black rounded-full p-1 hover:bg-red-100 cursor-pointer"><X size={16}/></button>
            </div>
            <div className="flex gap-2 mb-3">
              <input value={name} onChange={e => setName(e.target.value)} className={comicStyles.input} placeholder="新夥伴名字..." />
              <button onClick={() => { if(name.trim()) { onAdd(name.trim()); setName(''); } }} className="bg-black text-yellow-300 px-3.5 rounded-xl border-2 border-black font-black cursor-pointer"><Plus size={18}/></button>
            </div>
            <div className="flex flex-wrap gap-2 pt-1">
              {members.map(m => (
                <div key={m} className="bg-gray-100 border-2 border-black px-3 py-1 rounded-full flex items-center gap-1.5 font-bold text-xs">
                  {m}
                  <button onClick={() => onRemove(m)} className="text-gray-400 hover:text-red-600 cursor-pointer"><X size={13}/></button>
                </div>
              ))}
              {members.length === 0 && <div className="text-xs text-gray-400 font-bold py-2">目前尚無成員</div>}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
